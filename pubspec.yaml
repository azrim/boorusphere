name: boorusphere
description: Simple, content-focused booru viewer for Android
homepage: https://github.com/azrim/boorusphere
repository: https://github.com/azrim/boorusphere.git

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

version: 3.0.0+92

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.5.2
  async: ^2.13.1
  auto_route: ^11.2.0
  collection: ^1.19.1
  cookie_jar: ^4.0.9
  deep_pick: ^1.3.0
  dio_cookie_manager: ^3.5.0
  dio_smart_retry: ^7.0.1
  dio: ^5.11.1
  dynamic_color: ^1.9.0
  file_picker: ^13.2.0
  flutter_cache_manager: ^3.4.5
  flutter_displaymode: ^0.7.0
  flutter_downloader: ^1.12.1
  flutter_hooks: ^0.21.3+1
  flutter_local_notifications: ^22.3.2
  flutter_markdown_plus: ^1.0.12
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  hooks_riverpod: ^3.3.2
  html_unescape: ^2.0.0
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  mime: ^2.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  # 13.x compiles against Android SDK 37, which this toolchain does not have.
  permission_handler: ^12.0.3
  riverpod_annotation: ^4.0.3
  scroll_to_index: ^3.0.1
  separated_row: ^3.0.4
  shimmer: ^4.0.0
  slang_flutter: ^4.19.0
  slang: ^4.19.2
  sqflite: ^2.4.5
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  visibility_detector: ^0.4.0+2
  xml: ^6.6.1
  yaml: ^3.1.4
  wakelock_plus: ^1.8.2
  cached_network_image: ^4.0.5
  pointycastle: ^4.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  # 4.x requires analyzer >=13; auto_route_generator 10.6.0 caps it below 14 and
  # hive_ce_generator 1.11.2 pins ^12, so 3.2.6-dev.1 stays the only workable line.
  freezed: ^3.2.6-dev.1
  grinder: ^0.10.2
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  pigeon: ^27.3.0

flutter_icons:
  android: true
  ios: false
  image_path: assets/icons/exported/legacy-fill.png
  image_path_android: assets/icons/exported/legacy-circle.png
  adaptive_icon_foreground: assets/icons/exported/adaptive-foreground.png
  adaptive_icon_background: "#f6ebf9"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/servers.json
    - assets/icons/exported/logo.png
    - CHANGELOG.md
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Poppins.txt
    - assets/fonts/OFL-NotoSansThai.txt

  # One family for the whole app. Static instances are bundled instead of a
  # variable font so the weight a style asks for is the weight that renders.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
        - asset: assets/fonts/Geist-700.ttf
          weight: 700
    # The wordmark only: a geometric face against Geist's neutral grotesk, so
    # the name reads as a lockup instead of as the first line of the UI.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
    # Fallback for a script Geist does not cover, at the same weights so a
    # Thai title is not synthesised from a single face.
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansThai-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-600.ttf
          weight: 600

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
